name: Build and Release Latest llama.cpp GPU Builds

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: "既存タグがあっても新しい日付サフィックス付きタグでリリースする"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.meta.outputs.latest_tag }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_exists: ${{ steps.meta.outputs.release_exists }}
      should_build: ${{ steps.meta.outputs.should_build }}
    steps:
      - name: Resolve latest llama.cpp tag and release status
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag=$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp.git \
            | awk -F'/' '{print $3}' \
            | grep -E '^b[0-9]+' \
            | sort -V \
            | tail -n1)

          [[ -n "${latest_tag}" ]] || { echo "Failed to resolve latest tag"; exit 1; }

          release_tag="llama-gpu-${latest_tag}"
          if [[ "${{ github.event.inputs.force_release }}" == "true" ]]; then
            release_tag="${release_tag}-$(date -u +%Y%m%d%H%M%S)"
          fi

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            release_exists="true"
          else
            release_exists="false"
          fi

          if [[ "${release_exists}" == "true" ]]; then
            should_build="false"
          else
            should_build="true"
          fi

          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_exists=${release_exists}" >> "$GITHUB_OUTPUT"
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"

  build-matrix:
    if: needs.prepare.outputs.should_build == 'true'
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-cuda
            runs_on: ubuntu-latest
            backend: cuda
            ext: tar.gz
            cmake_flags: -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release
            artifact_prefix: llama-linux-cuda
            cuda_version: 12.4.1
          - target: windows-vulkan
            runs_on: windows-latest
            backend: vulkan
            ext: zip
            cmake_flags: -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release
            artifact_prefix: llama-windows-vulkan

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ matrix.cuda_version }}
          method: network

      - name: Setup Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers,Vulkan-Loader

      - name: Clone latest llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ needs.prepare.outputs.latest_tag }}" https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Build target
        shell: bash
        run: |
          set -euo pipefail
          cmake -S llama.cpp -B llama.cpp/build -G Ninja ${{ matrix.cmake_flags }}
          cmake --build llama.cpp/build --config Release

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "llama.cpp/build/bin/llama-cli" ]]; then
            llama.cpp/build/bin/llama-cli --version | head -n1
          elif [[ -x "llama.cpp/build/bin/main" ]]; then
            llama.cpp/build/bin/main --version | head -n1
          else
            echo "No known binary found" >&2
            exit 1
          fi

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tar -C llama.cpp/build -czf "${{ matrix.artifact_prefix }}-${{ needs.prepare.outputs.latest_tag }}.tar.gz" .

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "llama.cpp/build/*" -DestinationPath "${{ matrix.artifact_prefix }}-${{ needs.prepare.outputs.latest_tag }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ needs.prepare.outputs.latest_tag }}
          path: |
            ${{ matrix.artifact_prefix }}-${{ needs.prepare.outputs.latest_tag }}.tar.gz
            ${{ matrix.artifact_prefix }}-${{ needs.prepare.outputs.latest_tag }}.zip
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build-matrix
    if: always() && needs.prepare.result == 'success' && (needs.build-matrix.result == 'success' || needs.build-matrix.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Skip because release already exists
        if: needs.prepare.outputs.should_build == 'false'
        shell: bash
        run: |
          echo "Release tag already exists: ${{ needs.prepare.outputs.release_tag }}"
          echo "Build and release are skipped."

      - name: Download all artifacts
        if: needs.prepare.outputs.should_build == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        if: needs.prepare.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: llama.cpp GPU builds ${{ needs.prepare.outputs.latest_tag }}
          body: |
            Automated GPU builds for latest llama.cpp tag.

            Targets:
            - Linux amd64 CUDA
            - Windows amd64 Vulkan

            Upstream tag: `${{ needs.prepare.outputs.latest_tag }}`
          files: artifacts/**/*
